services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: mini_erp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_erp -d mini_erp"]
      interval: 2s
      timeout: 5s
      retries: 20
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: mini_erp_test
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_erp -d mini_erp_test"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  postgres_test_data:
