name: Mini-ERP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      E2E_TEST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://mini_erp:local_test_only@127.0.0.1:55433/mini_erp_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: mini_erp_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp -d mini_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies and generate Prisma client
        run: npm ci --ignore-scripts && npm run db:generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check types, logic, build and browser acceptance tests
        run: npm run ci:check
      - name: Keep test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
